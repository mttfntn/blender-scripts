name: Tests

# Runs the test suite in Blender 5.3 on every push and pull request.
# The project has no releases, so nothing is built or stored.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  BLENDER_VERSION: "5.3.0"
  BLENDER_SERIES: "5.3"
  # From https://download.blender.org/release/Blender5.3/blender-5.3.0.sha256
  BLENDER_SHA256: "dacb8264197a3f7fda6001285a5a506fc97ee943881261c2c3bd63c882f22e05"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check the workflow's Blender version matches manifest.json
        run: |
          test "$(jq -r .blender_download manifest.json)" = "$BLENDER_VERSION"

      - name: Cache Blender
        id: cache
        uses: actions/cache@v4
        with:
          path: blender.tar.xz
          key: blender-${{ env.BLENDER_VERSION }}-${{ env.BLENDER_SHA256 }}

      - name: Download Blender (with retries and mirrors)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          file="blender-${BLENDER_VERSION}-linux-x64.tar.xz"
          for base in \
              https://download.blender.org/release \
              https://mirrors.ocf.berkeley.edu/blender/release \
              https://ftp.halifax.rwth-aachen.de/blender/release \
              https://mirror.clarkson.edu/blender/release; do
            url="$base/Blender${BLENDER_SERIES}/$file"
            echo "Trying $url"
            if curl -fL --retry 3 --retry-delay 5 --connect-timeout 30 -o blender.tar.xz "$url" \
                && echo "$BLENDER_SHA256  blender.tar.xz" | sha256sum -c -; then
              exit 0
            fi
            rm -f blender.tar.xz
          done
          echo "Could not download a Blender build with the expected checksum" >&2
          exit 1

      - name: Verify checksum and unpack Blender
        run: |
          echo "$BLENDER_SHA256  blender.tar.xz" | sha256sum -c -
          mkdir blender && tar -xf blender.tar.xz -C blender --strip-components=1
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxi6 libxxf86vm1 libxfixes3 libxrender1 libxkbcommon0 libsm6 libgl1 libegl1 > /dev/null

      - name: Run tests (scratch profile, factory settings)
        run: |
          mkdir -p "$RUNNER_TEMP/blender-profile"
          BLENDER_USER_RESOURCES="$RUNNER_TEMP/blender-profile" \
            ./blender/blender -b --factory-startup --python-exit-code 1 --python tests/run_tests.py
