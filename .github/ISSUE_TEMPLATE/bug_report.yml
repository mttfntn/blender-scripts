name: Bug report
description: A script fails, gives a wrong result or shows an error.
labels: ["bug"]
body:
  - type: dropdown
    id: script
    attributes:
      label: Script
      options:
        - rotate_z_90.py
        - grid_circle.py
        - gn_simple_deform.py
        - uv_channels.py
        - proxy_setup.py
        - rotate_view.py
    validations:
      required: true
  - type: input
    id: blender
    attributes:
      label: Blender version
      description: Help › About Blender. Only Blender 5.3 is supported.
      placeholder: "5.3.0"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: blender-scripts version
      description: The release you downloaded (for example v1.0.0), or the commit if you copied the script from the repository.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "Windows 11, macOS 15, Ubuntu 24.04..."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What was selected, which options you used (redo panel or modifier settings), and what you clicked.
      placeholder: |
        1. Add a cylinder and subdivide it
        2. Run gn_simple_deform.py
        3. Set Mode to Bend, Axis to X
        4. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected and what happened
    validations:
      required: true
  - type: textarea
    id: errors
    attributes:
      label: Error messages
      description: Copy the full text from the Info editor or the system console (Window › Toggle System Console on Windows).
      render: text
  - type: textarea
    id: files
    attributes:
      label: Screenshots or a small .blend file
      description: Drag files here. A small .blend that shows the problem helps the most.
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: For example other add-ons that touch the same menus, or whether the script was run twice.
